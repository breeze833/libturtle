<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>libturtle - canvas-wasi Progressive Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .canvas-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      display: block;
      background: #ffffff;
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }

    .status-bar {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      gap: 1.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <h1>🐢 libturtle Graphics</h1>
    <p class="subtitle">WASI WebAssembly backend driving HTML5 Canvas (<a href="https://github.com/breeze833/canvas-wasi" target="_blank" style="color: var(--accent)">canvas-wasi</a>)</p>
  </header>

  <main class="canvas-container">
    <canvas id="turtle-viewport" width="800" height="600"></canvas>
    <div class="status-bar">
      <span class="badge"><span class="badge-dot" id="status-dot"></span><span id="status-text">Running progressive WASM demo...</span></span>
      <span id="resolution-badge">800 × 600</span>
    </div>
  </main>

  <div class="controls">
    <button id="restart-btn">Restart Animation</button>
    <button id="close-btn" style="background: #475569; color: #f8fafc;">Close / Exit (ESC)</button>
  </div>

  <script type="module">
    const canvas = document.getElementById("turtle-viewport");
    const statusText = document.getElementById("status-text");
    const statusDot = document.getElementById("status-dot");
    const restartBtn = document.getElementById("restart-btn");
    const closeBtn = document.getElementById("close-btn");

    let worker = null;
    let controlArray = null;

    if (typeof SharedArrayBuffer !== "undefined") {
      try {
        controlArray = new Int32Array(new SharedArrayBuffer(1024));
      } catch (e) {
        controlArray = null;
      }
    }

    function terminateSession(reason) {
      if (controlArray) {
        controlArray[0] = 1;
        controlArray[27] = 1;
      }
      if (worker) {
        worker.postMessage({ type: "close" });
        worker.postMessage({ type: "keydown", keyCode: 27 });
        /* Allow WASM cleanup briefly; terminate if it doesn't close promptly */
        setTimeout(() => {
          if (worker) {
            worker.terminate();
            worker = null;
            statusText.textContent = reason || "Session terminated (ESC / Close)";
            statusDot.style.background = "#94a3b8";
          }
        }, 100);
      }
    }

    function startWorker() {
      if (worker) worker.terminate();

      if (controlArray) {
        controlArray.fill(0);
      }

      statusText.textContent = "Loading WASM module...";
      statusDot.style.background = "#38bdf8";

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      worker = new Worker("./worker.js", { type: "module" });

      if (controlArray) {
        worker.postMessage({ type: "init_control", buffer: controlArray.buffer });
      }

      worker.onmessage = (e) => {
        const { type, bitmap, width, height, title } = e.data;
        if (type === "init") {
          canvas.width = width;
          canvas.height = height;
          document.getElementById("resolution-badge").textContent = `${width} × ${height}`;
          statusText.textContent = `Rendering: ${title}`;
          statusDot.style.background = "#22c55e";
        } else if (type === "frame") {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();
        } else if (type === "close") {
          statusText.textContent = "Session closed (ESC / Window Close)";
          statusDot.style.background = "#94a3b8";
          if (worker) {
            worker.terminate();
            worker = null;
          }
        }
      };

      worker.onerror = (err) => {
        console.error(err);
        statusText.textContent = "Error running WebAssembly module";
        statusDot.style.background = "#ef4444";
      };
    }

    window.addEventListener("keydown", (e) => {
      const code = e.keyCode || (e.key === "Escape" ? 27 : 0);
      if (controlArray && code < controlArray.length) {
        controlArray[code] = 1;
      }
      if (worker) {
        worker.postMessage({ type: "keydown", keyCode: code });
      }
      if (code === 27) {
        terminateSession("Session terminated (ESC key pressed)");
      }
    });

    window.addEventListener("keyup", (e) => {
      const code = e.keyCode || (e.key === "Escape" ? 27 : 0);
      if (controlArray && code < controlArray.length) {
        controlArray[code] = 0;
      }
      if (worker) {
        worker.postMessage({ type: "keyup", keyCode: code });
      }
    });

    restartBtn.addEventListener("click", startWorker);
    closeBtn.addEventListener("click", () => terminateSession("Session closed by user"));
    startWorker();
  </script>
</body>
</html>
